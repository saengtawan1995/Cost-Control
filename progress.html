<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>อัปเดตงวดงาน • แสงตะวัน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --pg:#8b5cf6; --pg-d:#6d28d9; --ink:#1e293b; --mut:#64748b;
    --line:#e2e8f0; --bg:#f1f5f9; --red:#E02424; --grn:#16a34a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Sarabun",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    padding:0 0 40px;
  }
  .hd{
    background:var(--pg); color:#fff; padding:16px 18px;
    display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5;
  }
  .hd .ic{font-size:22px}
  .hd .tt{font-weight:700; font-size:18px}
  .who{font-size:13px; color:#ede9fe; margin-top:2px}
  .wrap{max-width:560px; margin:0 auto; padding:14px}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
  label{display:block; font-weight:600; font-size:14px; margin:12px 0 6px}
  label:first-child{margin-top:0}
  label .req{color:var(--red)}
  input,select,textarea{
    width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--pg)}
  textarea{min-height:70px; resize:vertical}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  .hint{font-size:12px; color:var(--mut); margin-top:4px}
  .curbox{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:13px;color:#5b21b6}
  .curbox b{font-weight:700}
  .btn{
    width:100%; padding:15px; font-size:17px; font-weight:700; color:#fff;
    background:var(--pg); border:none; border-radius:12px; cursor:pointer;
  }
  .btn:active{background:var(--pg-d)}
  .btn:disabled{background:#cbd5e1; cursor:not-allowed}
  .btn2{width:100%; padding:15px; font-size:17px; font-weight:700; color:var(--pg);
    background:#fff; border:2px solid var(--pg); border-radius:12px; cursor:pointer;}
  .btn2:active{background:#ede9fe}
  .msg{padding:14px; border-radius:10px; margin:0 0 12px; font-size:14px; white-space:pre-line; display:none}
  .msg.ok{background:#dcfce7; color:#166534; display:block}
  .msg.err{background:#fee2e2; color:#991b1b; display:block}
  .center{text-align:center; color:var(--mut); padding:40px 20px}
  .hide{display:none !important}
  /* ปฏิทินไทย */
  .datebtn{width:100%;text-align:left;padding:12px 14px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px;color:var(--ink);}
  .cal{margin-top:8px;border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-hd button{border:none;background:#f1f5f9;border-radius:10px;width:40px;height:40px;font-size:22px;line-height:1;color:var(--pg);}
  #calTitle{font-weight:700;font-size:16px;color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow div{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;}
  .cal-day{text-align:center;padding:10px 0;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink);}
  .cal-day.mut{color:transparent;cursor:default;}
  .cal-day.sel{background:var(--pg);color:#fff;font-weight:700;}
  .cal-day.today{border:1px solid var(--pg);}
  .cal-foot{margin-top:8px;text-align:right;}
  .cal-foot button{border:none;background:#f1f5f9;border-radius:10px;padding:8px 16px;color:var(--pg);font-weight:600;}
</style>
</head>
<body>

<div class="hd">
  <span class="ic">🏗️</span>
  <div>
    <div class="tt">อัปเดตงวดงาน / ความคืบหน้า</div>
    <div class="who" id="who">กำลังโหลด…</div>
  </div>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <!-- หน้าโหลด -->
  <div id="loading" class="center">⏳ กำลังโหลดข้อมูล…</div>

  <!-- ฟอร์ม -->
  <div id="formView" class="card hide">
    <label>โครงการ <span class="req">*</span></label>
    <select id="project"><option value="">— เลือกโครงการ —</option></select>
    <div class="curbox hide" id="curBox"></div>

    <label>สถานะปัจจุบัน (หลังอัปเดต) <span class="req">*</span></label>
    <select id="status">
      <option value="">— เลือกสถานะ —</option>
      <option>เตรียมพื้นที่/ขอใบอนุญาต</option>
      <option>เข้าพื้นที่ / เริ่มงาน</option>
      <option>งานดิน / ปรับพื้นที่</option>
      <option>งานโครงสร้าง</option>
      <option>งานระบบ / งานส่วนประกอบ</option>
      <option>ส่งตรวจรับงวดงาน</option>
      <option>ปรับปรุงแก้ไข (แก้ defect)</option>
      <option>แล้วเสร็จ รอปิดงาน</option>
      <option value="__other__">อื่นๆ (ระบุเอง)…</option>
    </select>
    <input type="text" id="statusOther" class="hide" style="margin-top:8px" placeholder="ระบุสถานะเอง" />

    <div class="row">
      <div>
        <label>งวดงานที่ <span style="color:var(--mut);font-weight:400">(ถ้ามี)</span></label>
        <input type="text" id="phase" inputmode="numeric" placeholder="เช่น 1, 2, 3" />
      </div>
      <div>
        <label>% ความคืบหน้า <span style="color:var(--mut);font-weight:400">(ถ้ามี)</span></label>
        <input type="text" id="percent" inputmode="decimal" placeholder="0–100" />
      </div>
    </div>

    <label>วันที่อัปเดต <span class="req">*</span></label>
    <button type="button" id="dateBtn" class="datebtn">— เลือกวันที่ —</button>
    <input type="hidden" id="date" />
    <div id="cal" class="cal hide">
      <div class="cal-hd">
        <button type="button" id="calPrev">‹</button>
        <div id="calTitle">—</div>
        <button type="button" id="calNext">›</button>
      </div>
      <div class="cal-grid cal-dow" id="calDow"></div>
      <div class="cal-grid" id="calDays"></div>
      <div class="cal-foot"><button type="button" id="calToday">วันนี้</button></div>
    </div>

    <label>หมายเหตุ <span style="color:var(--mut);font-weight:400">(ถ้ามี)</span></label>
    <textarea id="note" placeholder="รายละเอียดงานที่ทำ / อุปสรรค / สิ่งที่ต้องตามต่อ"></textarea>

    <label>รูปหน้างาน <span style="color:var(--mut);font-weight:400">(ถ้ามี)</span></label>
    <input type="file" id="photo" accept="image/*" capture="environment" />
    <div id="photoInfo" class="hint hide" style="margin-top:6px"></div>

    <button type="button" class="btn" id="saveBtn" style="margin-top:16px">🏗️ บันทึกอัปเดต</button>
  </div>

  <!-- หน้ายืนยันสำเร็จ -->
  <div id="done" class="card hide" style="text-align:center">
    <div style="font-size:52px;line-height:1">✅</div>
    <div style="font-weight:700;font-size:20px;margin:8px 0 4px">บันทึกอัปเดตสำเร็จ</div>
    <div id="doneDetail" class="hint" style="font-size:14px;margin-bottom:18px">—</div>
    <button type="button" class="btn" id="moreBtn">➕ อัปเดตโครงการอื่นต่อ</button>
    <button type="button" class="btn2" id="closeBtn" style="margin-top:10px">✖ ปิดหน้านี้</button>
  </div>
</div>

<script>
/* ========= ตั้งค่า ========= */
// ★★ วาง LIFF ID ของฟอร์มอัปเดตงวดงานที่นี่ ★★
var LIFF_ID = "2011277267-ZRq63UUh";
var API_URL = "https://script.google.com/macros/s/AKfycbyyhj02NSB6JRWBAX8DEArox-ScQEGZ5MsKdyIV0ymYswEqifKSqqIIIciTpisTtNsg3Q/exec";

/* ========= state ========= */
var TOKEN = "";
var PROJS = [];

/* ========= helpers ========= */
function $(id){ return document.getElementById(id); }
function show(el){ el.classList.remove("hide"); }
function hide(el){ el.classList.add("hide"); }
function showMsg(text, ok){
  var m = $("msg");
  m.textContent = text; m.className = "msg " + (ok ? "ok" : "err");
  window.scrollTo(0,0);
}
function hideMsg(){ $("msg").className="msg"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function api(payload){
  payload.accessToken = TOKEN;
  return fetch(API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

/* ===== ปฏิทินไทย — #date เก็บ ค.ศ. yyyy-mm-dd ===== */
var TH_MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var TH_DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
var calY, calM;
function pad2(n){ return (n<10?"0":"")+n; }
function isoOf(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function thaiDate(iso){
  if(!iso) return "";
  var p = iso.split("-"); if(p.length!==3) return "";
  return parseInt(p[2],10) + " " + TH_MONTHS[parseInt(p[1],10)-1] + " " + (parseInt(p[0],10)+543);
}
function updateDateUI(){
  var v = $("date").value;
  $("dateBtn").textContent = v ? thaiDate(v) : "— เลือกวันที่ —";
}
function renderCal(){
  $("calTitle").textContent = TH_MONTHS[calM] + " " + (calY+543);
  var dow=$("calDow"); dow.innerHTML="";
  for(var i=0;i<7;i++){ var e=document.createElement("div"); e.textContent=TH_DOW[i]; dow.appendChild(e); }
  var days=$("calDays"); days.innerHTML="";
  var first=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var sel=$("date").value;
  var t=new Date(); var todayIso=isoOf(t.getFullYear(),t.getMonth(),t.getDate());
  for(var i=0;i<first;i++){ var b=document.createElement("div"); b.className="cal-day mut"; days.appendChild(b); }
  for(var dd=1;dd<=dim;dd++){
    var iso=isoOf(calY,calM,dd);
    var c=document.createElement("div"); c.className="cal-day"; c.textContent=dd;
    if(iso===sel) c.className+=" sel";
    if(iso===todayIso) c.className+=" today";
    (function(x){ c.addEventListener("click",function(){ $("date").value=x; updateDateUI(); hide($("cal")); }); })(iso);
    days.appendChild(c);
  }
}
function openCal(){
  var v=$("date").value; var d = v ? new Date(v+"T00:00:00") : new Date();
  calY=d.getFullYear(); calM=d.getMonth();
  renderCal(); show($("cal"));
}

/* ========= boot ========= */
function boot(){
  api({ action:"progress.boot" }).then(function(d){
    if(!d || !d.ok){ showMsg("โหลดข้อมูลไม่สำเร็จ: " + ((d&&d.error)||"ไม่ทราบสาเหตุ"), false); hide($("loading")); return; }
    var u = d.user||{};
    $("who").textContent = "ผู้บันทึก: " + (u.name||"(ไม่ระบุ)") + (u.role?(" • "+u.role):"");
    PROJS = d.projects||[];
    if(!PROJS.length){
      hide($("loading"));
      showMsg("ยังไม่มีโครงการที่เปิดอยู่ให้อัปเดต (เปิดโครงการก่อนที่เมนู เปิด/ปิด โครงการ)", false);
      return;
    }
    var sel=$("project");
    for(var i=0;i<PROJS.length;i++){
      var o=document.createElement("option");
      o.value=PROJS[i].key; o.textContent=PROJS[i].label; sel.appendChild(o);
    }
    // วันที่ = วันนี้ (เขตเวลาไทย)
    var now=new Date(); var th=new Date(now.getTime()+(now.getTimezoneOffset()+420)*60000);
    $("date").value = th.toISOString().slice(0,10); updateDateUI();
    hide($("loading")); show($("formView"));
  }).catch(function(e){
    hide($("loading")); showMsg("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: " + (e.message||e), false);
  });
}

/* ========= แสดงสถานะปัจจุบันของโครงการที่เลือก ========= */
function onProjectChange(){
  var key=$("project").value;
  var box=$("curBox");
  if(!key){ hide(box); return; }
  var cur="";
  for(var i=0;i<PROJS.length;i++){ if(PROJS[i].key===key){ cur=PROJS[i].status||""; break; } }
  box.innerHTML = cur ? ("สถานะปัจจุบันในระบบ: <b>"+esc(cur)+"</b>") : "ยังไม่มีสถานะบันทึกไว้";
  show(box);
}

/* ========= events ========= */
$("project").addEventListener("change", onProjectChange);
$("status").addEventListener("change", function(){
  if($("status").value==="__other__"){ show($("statusOther")); $("statusOther").focus(); }
  else{ hide($("statusOther")); }
});

// ปฏิทิน
$("dateBtn").addEventListener("click", function(){
  if ($("cal").classList.contains("hide")) openCal(); else hide($("cal"));
});
$("calPrev").addEventListener("click", function(){ calM--; if(calM<0){ calM=11; calY--; } renderCal(); });
$("calNext").addEventListener("click", function(){ calM++; if(calM>11){ calM=0; calY++; } renderCal(); });
$("calToday").addEventListener("click", function(){
  var t=new Date(); $("date").value=isoOf(t.getFullYear(),t.getMonth(),t.getDate());
  updateDateUI(); hide($("cal"));
});

/* ========= ย่อรูปเป็น base64 JPEG (กันไฟล์ใหญ่/ช้า) ========= */
function readPhoto(){
  return new Promise(function(resolve){
    var f = $("photo").files && $("photo").files[0];
    if(!f){ resolve(""); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var MAX = 1280;
        var w = img.width, h = img.height;
        if(w>h && w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        else if(h>=w && h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
        var cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ resolve(cv.toDataURL("image/jpeg", 0.8)); }
        catch(e){ resolve(""); }
      };
      img.onerror = function(){ resolve(""); };
      img.src = fr.result;
    };
    fr.onerror = function(){ resolve(""); };
    fr.readAsDataURL(f);
  });
}
$("photo").addEventListener("change", function(){
  var f = this.files && this.files[0];
  if(f){ $("photoInfo").textContent = "แนบรูป: "+f.name; show($("photoInfo")); }
  else { hide($("photoInfo")); }
});

/* ========= บันทึก ========= */
$("saveBtn").addEventListener("click", function(){
  var project=$("project").value;
  if(!project){ showMsg("กรุณาเลือกโครงการ", false); return; }
  var status=$("status").value;
  if(status==="__other__"){ status=($("statusOther").value||"").trim(); }
  if(!status){ showMsg("กรุณาเลือก/ระบุสถานะปัจจุบัน", false); return; }
  var pct=($("percent").value||"").replace(/,/g,"").trim();
  if(pct!==""){ var pn=parseFloat(pct); if(isNaN(pn)||pn<0||pn>100){ showMsg("% ความคืบหน้าต้องอยู่ระหว่าง 0–100", false); return; } }
  if(!$("date").value){ showMsg("กรุณาเลือกวันที่อัปเดต", false); return; }

  $("saveBtn").disabled=true; $("saveBtn").textContent="กำลังบันทึก…";
  readPhoto().then(function(photo){
  return api({ action:"progress.save", project:project, status:status,
    percent:pct, phase:($("phase").value||"").trim(), note:($("note").value||"").trim(), date:$("date").value, photo:photo })
  .then(function(d){
    $("saveBtn").disabled=false; $("saveBtn").textContent="🏗️ บันทึกอัปเดต";
    if(!d.ok){ showMsg("บันทึกไม่สำเร็จ: "+d.error, false); return; }
    $("doneDetail").textContent = d.message || "อัปเดตเรียบร้อย";
    hideMsg(); hide($("formView")); show($("done")); window.scrollTo(0,0);
  }).catch(function(e){
    $("saveBtn").disabled=false; $("saveBtn").textContent="🏗️ บันทึกอัปเดต";
    showMsg("บันทึกไม่สำเร็จ: "+(e.message||e), false);
  });
  });
});

// อัปเดตโครงการอื่นต่อ → รีเซ็ตฟอร์ม
$("moreBtn").addEventListener("click", function(){
  $("project").value=""; $("status").value=""; hide($("statusOther")); $("statusOther").value="";
  $("phase").value=""; $("percent").value=""; $("note").value=""; hide($("curBox"));
  $("photo").value=""; hide($("photoInfo"));
  var now=new Date(); var th=new Date(now.getTime()+(now.getTimezoneOffset()+420)*60000);
  $("date").value=th.toISOString().slice(0,10); updateDateUI();
  hide($("done")); show($("formView")); hideMsg(); window.scrollTo(0,0);
});
// ปิดหน้านี้
$("closeBtn").addEventListener("click", function(){
  try{ if (window.liff && liff.closeWindow){ liff.closeWindow(); } }catch(e){}
  $("done").innerHTML = '<div style="font-size:52px">👋</div>'
    + '<div style="font-weight:700;font-size:18px;margin-top:8px">ปิดหน้านี้ได้เลยค่ะ</div>'
    + '<div class="hint" style="margin-top:6px">บันทึกอัปเดตเรียบร้อยแล้ว</div>';
});

/* ========= start (LIFF) ========= */
function start(){
  if (!LIFF_ID || LIFF_ID==="PASTE_PROGRESS_LIFF_ID"){ showMsg("ยังไม่ได้ตั้งค่า LIFF_ID (แก้ตัวแปร LIFF_ID ในไฟล์ progress.html)", false); hide($("loading")); return; }
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()){ liff.login(); return; }
    TOKEN = liff.getAccessToken() || "";
    if (!TOKEN){ showMsg("ไม่พบ access token — กรุณาเปิดฟอร์มนี้ผ่านแอป LINE", false); return; }
    boot();
  }).catch(function(e){
    showMsg("เริ่มระบบ LINE ไม่สำเร็จ: " + (e.message||e), false);
  });
}
window.addEventListener("load", start);
</script>
</body>
</html>
