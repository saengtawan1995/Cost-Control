<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>บันทึกรายรับ • แสงตะวัน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --grn:#16a34a; --grn-d:#15803d; --ink:#1e293b; --mut:#64748b;
    --line:#e2e8f0; --bg:#f1f5f9; --red:#E02424;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Sarabun",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    padding:0 0 40px;
  }
  .hd{
    background:var(--grn); color:#fff; padding:16px 18px;
    display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5;
  }
  .hd .ic{font-size:22px}
  .hd .tt{font-weight:700; font-size:18px}
  .who{font-size:13px; color:#dcfce7; margin-top:2px}
  .wrap{max-width:560px; margin:0 auto; padding:14px}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
  label{display:block; font-weight:600; font-size:14px; margin:12px 0 6px}
  label .req{color:var(--red)}
  input,select,textarea{
    width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--grn)}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  .hint{font-size:12px; color:var(--mut); margin-top:4px}
  .bar{position:fixed; left:0; right:0; bottom:0; padding:12px 14px; background:#fff; border-top:1px solid var(--line)}
  .bar .inner{max-width:560px; margin:0 auto}
  .btn{
    width:100%; padding:15px; font-size:17px; font-weight:700; color:#fff;
    background:var(--grn); border:none; border-radius:12px; cursor:pointer;
  }
  .btn:active{background:var(--grn-d)}
  .btn:disabled{background:#cbd5e1; cursor:not-allowed}
  .btn2{width:100%; padding:15px; font-size:17px; font-weight:700; color:var(--grn);
    background:#fff; border:2px solid var(--grn); border-radius:12px; cursor:pointer;}
  .btn2:active{background:#dcfce7}
  .msg{padding:14px; border-radius:10px; margin:0 0 12px; font-size:14px; white-space:pre-line; display:none}
  .msg.ok{background:#dcfce7; color:#166534; display:block}
  .msg.err{background:#fee2e2; color:#991b1b; display:block}
  .center{text-align:center; color:var(--mut); padding:40px 20px}
  .hide{display:none !important}
  .amount{font-size:22px; font-weight:700; text-align:right}
  .datebtn{width:100%;text-align:left;padding:12px 14px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px;color:var(--ink);}
  .cal{margin-top:8px;border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-hd button{border:none;background:#f1f5f9;border-radius:10px;width:40px;height:40px;font-size:22px;line-height:1;color:var(--grn);}
  #calTitle{font-weight:700;font-size:16px;color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow div{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;}
  .cal-day{text-align:center;padding:10px 0;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink);}
  .cal-day.mut{color:transparent;cursor:default;}
  .cal-day.sel{background:var(--grn);color:#fff;font-weight:700;}
  .cal-day.today{border:1px solid var(--grn);}
  .cal-foot{margin-top:8px;text-align:right;}
  .cal-foot button{border:none;background:#f1f5f9;border-radius:10px;padding:8px 16px;color:var(--grn);font-weight:600;}
</style>
</head>
<body>

<div class="hd">
  <span class="ic">💰</span>
  <div>
    <div class="tt">บันทึกรายรับ</div>
    <div class="who" id="who">กำลังโหลด…</div>
  </div>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <!-- หน้าโหลด -->
  <div id="loading" class="center">⏳ กำลังโหลดข้อมูล…</div>

  <!-- ฟอร์ม -->
  <div id="form" class="card hide">
    <label>โครงการ <span class="req">*</span></label>
    <select id="project"><option value="">— เลือกโครงการ —</option></select>

    <label>วันที่ <span class="req">*</span></label>
    <button type="button" id="dateBtn" class="datebtn">— เลือกวันที่ —</button>
    <input type="hidden" id="date" />
    <div id="cal" class="cal hide">
      <div class="cal-hd">
        <button type="button" id="calPrev">‹</button>
        <div id="calTitle">—</div>
        <button type="button" id="calNext">›</button>
      </div>
      <div class="cal-grid cal-dow" id="calDow"></div>
      <div class="cal-grid" id="calDays"></div>
      <div class="cal-foot"><button type="button" id="calToday">วันนี้</button></div>
    </div>

    <label>หมวดรายรับ <span class="req">*</span></label>
    <select id="category"><option value="">— เลือกหมวดหมู่ —</option></select>

    <label>รายการ</label>
    <input type="text" id="item" placeholder="เช่น งวดที่ 2 · งานผิวทาง" />

    <label>เลขที่เอกสาร</label>
    <input type="text" id="billNo" placeholder="เช่น ฎีกา/ใบส่งงวด (ไม่บังคับ)" />

    <label>จำนวนเงิน (บาท) <span class="req">*</span></label>
    <input type="text" id="amount" class="amount" inputmode="decimal" placeholder="0.00" />

    <label>วิธีรับเงิน</label>
    <select id="pay"></select>
  </div>

  <!-- หน้ายืนยันหลังบันทึกสำเร็จ -->
  <div id="done" class="card hide" style="text-align:center">
    <div style="font-size:52px;line-height:1">✅</div>
    <div style="font-weight:700;font-size:20px;margin:8px 0 4px">บันทึกสำเร็จ</div>
    <div id="doneDetail" class="hint" style="font-size:14px;margin-bottom:18px">—</div>
    <button type="button" class="btn" id="againBtn">➕ บันทึกรายการอื่นต่อ</button>
    <button type="button" class="btn2" id="closeBtn" style="margin-top:10px">✖ ปิดหน้านี้</button>
  </div>
</div>

<div class="bar hide" id="bar">
  <div class="inner">
    <button class="btn" id="submitBtn">บันทึกรายรับ</button>
  </div>
</div>

<script>
/* ========= ตั้งค่า ========= */
var LIFF_ID = "2011277267-R8IA9hYV";
// ★ วาง URL /exec ของ Apps Script Web App ที่ deploy แล้ว (ลงท้าย /exec)
var API_URL = "https://script.google.com/macros/s/AKfycbyyhj02NSB6JRWBAX8DEArox-ScQEGZ5MsKdyIV0ymYswEqifKSqqIIIciTpisTtNsg3Q/exec";

/* ========= state ========= */
var TOKEN = "";           // LINE access token

/* ========= helpers ========= */
function $(id){ return document.getElementById(id); }
function show(el){ el.classList.remove("hide"); }
function hide(el){ el.classList.add("hide"); }
function showMsg(text, ok){
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  window.scrollTo(0,0);
}
function opt(sel, arr, getV, getT){
  for (var i=0;i<arr.length;i++){
    var o=document.createElement("option");
    o.value=getV(arr[i]); o.textContent=getT(arr[i]);
    sel.appendChild(o);
  }
}
// ยิง API แบบ text/plain (simple request → ไม่มี CORS preflight)
function api(payload){
  payload.accessToken = TOKEN;
  return fetch(API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}
// ===== ปฏิทินไทย (สร้างเอง) — ค่าที่เก็บใน #date ยังเป็น ค.ศ. yyyy-mm-dd เหมือนเดิม =====
var TH_MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var TH_DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
var calY, calM; // ปี ค.ศ. และเดือน (0-11) ที่กำลังแสดง
function pad2(n){ return (n<10?"0":"")+n; }
function isoOf(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function thaiDate(iso){
  if(!iso) return "";
  var p = iso.split("-");           // yyyy-mm-dd
  if(p.length!==3) return "";
  return parseInt(p[2],10) + " " + TH_MONTHS[parseInt(p[1],10)-1] + " " + (parseInt(p[0],10)+543);
}
function updateDateUI(){
  var v = $("date").value;
  $("dateBtn").textContent = v ? thaiDate(v) : "— เลือกวันที่ —";
}
function renderCal(){
  $("calTitle").textContent = TH_MONTHS[calM] + " " + (calY+543);
  var dow=$("calDow"); dow.innerHTML="";
  for(var i=0;i<7;i++){ var e=document.createElement("div"); e.textContent=TH_DOW[i]; dow.appendChild(e); }
  var days=$("calDays"); days.innerHTML="";
  var first=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var sel=$("date").value;
  var t=new Date(); var todayIso=isoOf(t.getFullYear(),t.getMonth(),t.getDate());
  for(var i=0;i<first;i++){ var b=document.createElement("div"); b.className="cal-day mut"; days.appendChild(b); }
  for(var dd=1;dd<=dim;dd++){
    var iso=isoOf(calY,calM,dd);
    var c=document.createElement("div"); c.className="cal-day"; c.textContent=dd;
    if(iso===sel) c.className+=" sel";
    if(iso===todayIso) c.className+=" today";
    (function(x){ c.addEventListener("click",function(){ $("date").value=x; updateDateUI(); hide($("cal")); }); })(iso);
    days.appendChild(c);
  }
}
function openCal(){
  var v=$("date").value; var d = v ? new Date(v+"T00:00:00") : new Date();
  calY=d.getFullYear(); calM=d.getMonth();
  renderCal(); show($("cal"));
}

/* ========= boot ========= */
function boot(){
  api({ action:"income.boot" }).then(function(d){
    if(!d || !d.ok){ showMsg("โหลดข้อมูลไม่สำเร็จ: " + ((d&&d.error)||"ไม่ทราบสาเหตุ"), false); return; }

    // ผู้บันทึก
    var u = d.user||{};
    $("who").textContent = "ผู้บันทึก: " + (u.name||"(ไม่ระบุ)") + (u.role?(" • "+u.role):"");

    // dropdown
    opt($("project"),  d.projects||[],   function(x){return x.key;}, function(x){return x.label;});
    opt($("category"), d.catIncome||[],  function(x){return x;},     function(x){return x;});
    var pays = d.payMethods||["เงินสด","โอนเงิน","เช็ค","บัตรเครดิต"];
    opt($("pay"), pays, function(x){return x;}, function(x){return x;});

    // วันที่วันนี้ (เขตเวลาไทย)
    var now = new Date();
    var th = new Date(now.getTime() + (now.getTimezoneOffset()+420)*60000);
    $("date").value = th.toISOString().slice(0,10);
    updateDateUI();

    hide($("loading")); show($("form")); show($("bar"));
  }).catch(function(e){
    showMsg("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: " + (e.message||e) + "\n(ตรวจว่าใส่ API_URL ถูกต้อง)", false);
  });
}

/* ========= events ========= */
// ปฏิทินไทย: เปิด/ปิด + เลื่อนเดือน + วันนี้
$("dateBtn").addEventListener("click", function(){
  if ($("cal").classList.contains("hide")) openCal(); else hide($("cal"));
});
$("calPrev").addEventListener("click", function(){ calM--; if(calM<0){ calM=11; calY--; } renderCal(); });
$("calNext").addEventListener("click", function(){ calM++; if(calM>11){ calM=0; calY++; } renderCal(); });
$("calToday").addEventListener("click", function(){
  var t=new Date(); $("date").value=isoOf(t.getFullYear(),t.getMonth(),t.getDate());
  updateDateUI(); hide($("cal"));
});

// บันทึก
$("submitBtn").addEventListener("click", function(){
  var project=$("project").value, category=$("category").value;
  var amount=($("amount").value||"").replace(/,/g,"").trim();
  if(!project){ showMsg("กรุณาเลือกโครงการ", false); return; }
  if(!category){ showMsg("กรุณาเลือกหมวดรายรับ", false); return; }
  if(!amount || parseFloat(amount)<=0){ showMsg("กรุณากรอกจำนวนเงินให้ถูกต้อง", false); return; }

  $("submitBtn").disabled=true; $("submitBtn").textContent="กำลังบันทึก…";
  api({
    action:"income.save",
    project:project, date:$("date").value, category:category,
    billNo:$("billNo").value, item:$("item").value, amount:amount,
    pay:$("pay").value
  }).then(function(d){
    if(!d.ok){
      $("submitBtn").disabled=false; $("submitBtn").textContent="บันทึกรายรับ";
      showMsg("บันทึกไม่สำเร็จ: "+d.error, false); return;
    }
    // สำเร็จ → ล็อกฟอร์ม แล้วขึ้นหน้ายืนยันให้เลือกทำต่อ/ปิด
    var amt = parseFloat(amount).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
    var pjTxt = $("project").options[$("project").selectedIndex].textContent;
    $("doneDetail").textContent = pjTxt + " • " + category + " • ฿" + amt;
    hide($("msg"));
    hide($("form")); hide($("bar")); show($("done"));
    window.scrollTo(0,0);
  }).catch(function(e){
    $("submitBtn").disabled=false; $("submitBtn").textContent="บันทึกรายรับ";
    showMsg("บันทึกไม่สำเร็จ: "+(e.message||e), false);
  });
});

// บันทึกรายการอื่นต่อ → เคลียร์เฉพาะช่องรายการ (คงโครงการ/วันที่ไว้) แล้วกลับมาที่ฟอร์ม
$("againBtn").addEventListener("click", function(){
  $("billNo").value=""; $("item").value=""; $("amount").value="";
  $("category").value="";
  $("submitBtn").disabled=false; $("submitBtn").textContent="บันทึกรายรับ";
  hide($("done")); show($("form")); show($("bar"));
  $("msg").className="msg"; // ซ่อนข้อความ
  window.scrollTo(0,0);
});

// ปิดหน้านี้ → ปิดหน้าต่าง LIFF (ถ้าเปิดนอกไลน์จะซ่อนหน้าแทน)
$("closeBtn").addEventListener("click", function(){
  try{
    if (window.liff && liff.closeWindow){ liff.closeWindow(); }
  }catch(e){}
  $("done").innerHTML = '<div style="font-size:52px">👋</div>'
    + '<div style="font-weight:700;font-size:18px;margin-top:8px">ปิดหน้านี้ได้เลยค่ะ</div>'
    + '<div class="hint" style="margin-top:6px">บันทึกเรียบร้อยแล้ว</div>';
});

/* ========= start (LIFF) ========= */
function start(){
  if (!LIFF_ID){ showMsg("ยังไม่ได้ตั้งค่า LIFF_ID", false); return; }
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()){ liff.login(); return; }
    TOKEN = liff.getAccessToken() || "";
    if (!TOKEN){ showMsg("ไม่พบ access token — กรุณาเปิดฟอร์มนี้ผ่านแอป LINE", false); return; }
    boot();
  }).catch(function(e){
    showMsg("เริ่มระบบ LINE ไม่สำเร็จ: " + (e.message||e), false);
  });
}
window.addEventListener("load", start);
</script>
</body>
</html>
